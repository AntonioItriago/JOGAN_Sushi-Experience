<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JŌGAN | Panel Administrativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Serif JP',serif; background:#1a1a1a; color:#F5F5DC; min-height:100vh; }
.header { background:#000; padding:20px; text-align:center; border-bottom:3px solid #9ACD32; }
.header h1 { color:#C5E17A; font-size:1.8em; letter-spacing:2px; }
.header p { color:#F5F5DC; margin-top:6px; font-size:.85em; }
.container { max-width:1100px; margin:0 auto; padding:20px; }
.tabs { display:flex; gap:10px; margin-bottom:25px; flex-wrap:wrap; justify-content:center; }
.tab-btn { background:rgba(154,205,50,.15); color:#C5E17A; border:2px solid #9ACD32; padding:12px 20px; border-radius:6px; cursor:pointer; font-weight:bold; font-family:inherit; transition:.25s; }
.tab-btn:hover { background:rgba(154,205,50,.35); }
.tab-btn.active { background:#9ACD32; color:#111; }
.tab-content { display:none; background:#222; padding:25px; border-radius:10px; border:1px solid #9ACD32; }
.tab-content.active { display:block; }
.tab-content h2 { color:#C5E17A; margin-bottom:20px; border-bottom:2px solid #9ACD32; padding-bottom:10px; }
.form-group { margin-bottom:18px; }
.form-group label { display:block; margin-bottom:6px; color:#C5E17A; font-weight:bold; }
.form-group input,.form-group select,.form-group textarea { width:100%; padding:11px; background:#333; border:1px solid #9ACD32; border-radius:5px; color:#F5F5DC; font-family:inherit; font-size:1em; }
.form-group textarea { min-height:80px; resize:vertical; }
.categoria-selector { display:flex; gap:8px; flex-wrap:wrap; }
.categoria-selector input,.categoria-selector select { flex:1; min-width:140px; }
.btn { background:#9ACD32; color:#111; border:none; padding:12px 24px; border-radius:5px; cursor:pointer; font-weight:bold; font-family:inherit; transition:.25s; }
.btn:hover { background:#C5E17A; }
.btn:disabled { background:#666; cursor:not-allowed; }
.btn-danger { background:#c0392b; color:#fff; padding:8px 16px; }
.mensaje { margin-top:15px; padding:12px; border-radius:5px; display:none; }
.mensaje.ok { display:block; background:#d4edda; color:#155724; }
.mensaje.err { display:block; background:#f8d7da; color:#721c24; }
.lista { max-height:420px; overflow-y:auto; margin-top:15px; }
.producto-item { background:#2b2b2b; border:1px solid #444; padding:14px; margin-bottom:10px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; gap:12px; cursor:pointer; transition:.2s; }
.producto-item:hover { border-color:#9ACD32; background:#333; }
.producto-item h4 { color:#C5E17A; margin-bottom:5px; }
.producto-item p { font-size:.85em; color:#ddd; }
.debug { display:none; margin-top:20px; padding:12px; background:#111; border:1px solid #9ACD32; border-radius:5px; font-family:monospace; font-size:.8em; color:#9ACD32; white-space:pre-wrap; max-height:200px; overflow:auto; }
.aviso { font-size:.85em; color:#bbb; margin-bottom:20px; text-align:center; }
.aviso a { color:#C5E17A; }
@media(max-width:768px){
  .tabs{flex-direction:column}
  .tab-btn{width:100%}
  .container{padding:12px}
  .tab-content{padding:18px}
  .producto-item{flex-direction:column;align-items:flex-start}
  .btn-danger{width:100%}
}
</style>
</head>
<body>

<div class="header">
  <h1>🍣 JŌGAN | Panel Administrativo</h1>
  <p>Gestión de menú - SUSHI EXPERIENCE</p>
</div>

<div class="container">

  <p class="aviso">
    ¿No carga la lista? Usa el
    <a href="https://script.google.com/macros/s/AKfycbzNvtBRfypOY5CmrDUYrspANxmJJacSONHf3IG44jqz-sLAtlyCuKo_tfUJXEJmGfiF/exec" target="_blank">panel directo de Apps Script</a>
  </p>

  <div class="tabs">
    <button class="tab-btn active" data-tab="agregar">➕ Agregar Producto</button>
    <button class="tab-btn" data-tab="modificar">✏️ Modificar Producto</button>
    <button class="tab-btn" data-tab="eliminar">🗑️ Eliminar Producto</button>
  </div>

  <!-- AGREGAR -->
  <div id="tab-agregar" class="tab-content active">
    <h2>Agregar Nuevo Producto</h2>

    <div class="form-group">
      <label>Categoría</label>
      <div class="categoria-selector">
        <input type="text" id="agg-categoria" placeholder="Escribir nueva categoría...">
        <select id="agg-categoria-lista">
          <option value="">-- Seleccionar --</option>
        </select>
      </div>
    </div>

    <div class="form-group"><label>Nombre del Producto</label><input type="text" id="agg-nombre" placeholder="Ej: Jōgan Roll"></div>
    <div class="form-group"><label>Opciones / Proteína</label><input type="text" id="agg-opciones" placeholder="Ej: Pollo / Camarón"></div>
    <div class="form-group"><label>Descripción / Ingredientes</label><textarea id="agg-descripcion"></textarea></div>
    <div class="form-group"><label>Precio ($)</label><input type="number" step="0.01" id="agg-precio" placeholder="Ej: 9.00"></div>
    <div class="form-group"><label>Unidades / Piezas</label><input type="text" id="agg-unidades" placeholder="Ej: 8 Piezas"></div>
    <div class="form-group">
      <label>Disponible</label>
      <select id="agg-disponible"><option value="true">Sí</option><option value="false">No</option></select>
    </div>

    <button class="btn" id="btn-guardar-agregar">Agregar Producto</button>
    <div id="msg-agregar" class="mensaje"></div>
  </div>

  <!-- MODIFICAR -->
  <div id="tab-modificar" class="tab-content">
    <h2>Modificar Producto</h2>
    <div id="lista-modificar" class="lista"></div>

    <div id="form-modificar" style="display:none;margin-top:25px">
      <h2>Editar Producto</h2>
      <div class="form-group"><label>Categoría</label><input type="text" id="mod-categoria"></div>
      <div class="form-group"><label>Nombre del Producto</label><input type="text" id="mod-nombre"></div>
      <div class="form-group"><label>Opciones / Proteína</label><input type="text" id="mod-opciones"></div>
      <div class="form-group"><label>Descripción / Ingredientes</label><textarea id="mod-descripcion"></textarea></div>
      <div class="form-group"><label>Precio ($)</label><input type="number" step="0.01" id="mod-precio"></div>
      <div class="form-group"><label>Unidades / Piezas</label><input type="text" id="mod-unidades"></div>
      <div class="form-group">
        <label>Disponible</label>
        <select id="mod-disponible"><option value="true">Sí</option><option value="false">No</option></select>
      </div>
      <button class="btn" id="btn-guardar-modificar">Guardar Cambios</button>
      <div id="msg-modificar" class="mensaje"></div>
    </div>
  </div>

  <!-- ELIMINAR -->
  <div id="tab-eliminar" class="tab-content">
    <h2>Eliminar Producto</h2>
    <div id="lista-eliminar" class="lista"></div>
    <div id="msg-eliminar" class="mensaje"></div>
  </div>

  <div id="debug" class="debug"></div>
</div>

<script>
const SHEET_TSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS4kg3_0KQlDJt72rSTB7nqi5G5XcvyV0_2zkAQkqfOkSxiNM8ggO_8E2XQ0qOwu1PVFR9iLyb00faG/pub?gid=0&single=true&output=tsv';
const BACKEND = 'https://script.google.com/macros/s/AKfycbzNvtBRfypOY5CmrDUYrspANxmJJacSONHf3IG44jqz-sLAtlyCuKo_tfUJXEJmGfiF/exec';

const $ = function(id){ return document.getElementById(id); };
let nombreOriginal = '';
let productosCache = [];

function debug(msg){
  const d = $('debug');
  d.style.display = 'block';
  d.textContent += msg + '\n';
  console.log(msg);
}

function mensaje(id, texto, ok){
  const el = $(id);
  el.className = 'mensaje ' + (ok ? 'ok' : 'err');
  el.textContent = texto;
}

/* ---------- TABS ---------- */
document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    const destino = btn.getAttribute('data-tab');
    document.querySelectorAll('.tab-btn').forEach(function(b){
      b.classList.toggle('active', b === btn);
    });
    document.querySelectorAll('.tab-content').forEach(function(c){
      c.classList.toggle('active', c.id === 'tab-' + destino);
    });
    if(destino === 'modificar' || destino === 'eliminar'){
      cargarProductos();
    }
  });
});

/* ---------- LECTURA DESDE TSV (permite CORS) ---------- */
async function obtenerProductos(){
  const res = await fetch(SHEET_TSV + '&v=' + Date.now());
  if(!res.ok){ throw new Error('HTTP ' + res.status); }
  const texto = await res.text();
  const lineas = texto.replace(/\r/g,'').trim().split('\n');
  const headers = lineas[0].split('\t').map(function(h){ return h.trim(); });

  debug('Headers: ' + headers.join(' | '));

  const lista = [];
  for(let i=1; i<lineas.length; i++){
    const celdas = lineas[i].split('\t');
    if(!celdas[0] || !celdas[1]) continue;
    const p = {};
    headers.forEach(function(h, idx){
      p[h] = (celdas[idx] || '').trim();
    });
    lista.push(p);
  }
  debug('Productos leídos: ' + lista.length);
  return lista;
}

/* ---------- ESCRITURA HACIA APPS SCRIPT ---------- */
async function enviarAccion(action, data){
  // text/plain evita el preflight OPTIONS que Apps Script no soporta
  await fetch(BACKEND, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, data: data })
  });
}

/* ---------- Poblar categorías ---------- */
function poblarCategorias(lista){
  const cats = [...new Set(lista.map(function(p){ return p['Categoría']; }).filter(Boolean))];
  const select = $('agg-categoria-lista');
  select.innerHTML = '<option value="">-- Seleccionar --</option>';
  cats.forEach(function(cat){
    const op = document.createElement('option');
    op.value = cat;
    op.textContent = cat;
    select.appendChild(op);
  });
}

$('agg-categoria-lista').addEventListener('change', function(){
  if(this.value){ $('agg-categoria').value = this.value; }
});

/* ---------- Render de listas ---------- */
function renderListas(lista){
  const lm = $('lista-modificar');
  const le = $('lista-eliminar');
  lm.innerHTML = '';
  le.innerHTML = '';

  if(lista.length === 0){
    lm.innerHTML = '<p>No hay productos registrados.</p>';
    le.innerHTML = '<p>No hay productos registrados.</p>';
    return;
  }

  lista.forEach(function(p){
    const nombre = p['Nombre del Producto'] || '';
    const categoria = p['Categoría'] || '';
    const precio = p['Precio ($)'] || '';
    const disponible = String(p['Disponible']).toUpperCase() === 'TRUE';

    // Tarjeta modificar
    const card = document.createElement('div');
    card.className = 'producto-item';
    const info = document.createElement('div');
    const titulo = document.createElement('h4');
    titulo.textContent = nombre;
    const detalle = document.createElement('p');
    detalle.textContent = categoria + ' · ' + precio + ' · ' + (disponible ? '✅ Disponible' : '❌ No disponible');
    info.appendChild(titulo);
    info.appendChild(detalle);
    card.appendChild(info);
    card.addEventListener('click', function(){ cargarParaModificar(p); });
    lm.appendChild(card);

    // Tarjeta eliminar
    const card2 = document.createElement('div');
    card2.className = 'producto-item';
    const info2 = document.createElement('div');
    const t2 = document.createElement('h4');
    t2.textContent = nombre;
    const d2 = document.createElement('p');
    d2.textContent = categoria + ' · ' + precio;
    info2.appendChild(t2);
    info2.appendChild(d2);
    const btnDel = document.createElement('button');
    btnDel.className = 'btn btn-danger';
    btnDel.textContent = 'Eliminar';
    btnDel.addEventListener('click', function(ev){
      ev.stopPropagation();
      eliminar(nombre);
    });
    card2.appendChild(info2);
    card2.appendChild(btnDel);
    le.appendChild(card2);
  });
}

async function cargarProductos(){
  $('lista-modificar').innerHTML = '<p>Cargando productos...</p>';
  $('lista-eliminar').innerHTML = '<p>Cargando productos...</p>';
  try{
    productosCache = await obtenerProductos();
    poblarCategorias(productosCache);
    renderListas(productosCache);
  }catch(err){
    debug('ERROR: ' + err.message);
    $('lista-modificar').innerHTML = '<p style="color:#ff6b6b">No se pudo cargar. Revisa el debug.</p>';
    $('lista-eliminar').innerHTML = '<p style="color:#ff6b6b">No se pudo cargar.</p>';
  }
}

/* ---------- MODIFICAR ---------- */
function cargarParaModificar(p){
  nombreOriginal = p['Nombre del Producto'];
  $('mod-categoria').value = p['Categoría'] || '';
  $('mod-nombre').value = p['Nombre del Producto'] || '';
  $('mod-opciones').value = p['Opciones / Proteína'] || '';
  $('mod-descripcion').value = p['Descripción / Ingredientes'] || '';
  $('mod-precio').value = (p['Precio ($)'] || '').replace('$','').replace(',','.');
  $('mod-unidades').value = p['Unidades / Piezas'] || '';
  $('mod-disponible').value = String(p['Disponible']).toUpperCase() === 'TRUE' ? 'true' : 'false';
  $('form-modificar').style.display = 'block';
  $('form-modificar').scrollIntoView({ behavior:'smooth' });
}

$('btn-guardar-modificar').addEventListener('click', async function(){
  const btn = this;
  btn.disabled = true;
  const datos = {
    nombreOriginal: nombreOriginal,
    categoria: $('mod-categoria').value,
    nombre: $('mod-nombre').value,
    opciones: $('mod-opciones').value,
    descripcion: $('mod-descripcion').value,
    precio: $('mod-precio').value,
    unidades: $('mod-unidades').value,
    disponible: $('mod-disponible').value
  };
  try{
    await enviarAccion('modificarProducto', datos);
    mensaje('msg-modificar','✅ Solicitud enviada. Verifica la hoja en 1-2 minutos.',true);
    $('form-modificar').style.display = 'none';
  }catch(err){
    mensaje('msg-modificar','❌ ' + err.message,false);
  }finally{
    btn.disabled = false;
  }
});

/* ---------- AGREGAR ---------- */
$('btn-guardar-agregar').addEventListener('click', async function(){
  const btn = this;
  const categoria = $('agg-categoria').value.trim();
  const nombre = $('agg-nombre').value.trim();
  const precio = $('agg-precio').value;

  if(!categoria || !nombre || !precio){
    mensaje('msg-agregar','⚠️ Completa Categoría, Nombre y Precio.',false);
    return;
  }

  btn.disabled = true;
  const datos = {
    categoria: categoria,
    nombre: nombre,
    opciones: $('agg-opciones').value,
    descripcion: $('agg-descripcion').value,
    precio: precio,
    unidades: $('agg-unidades').value,
    disponible: $('agg-disponible').value
  };

  try{
    await enviarAccion('crearProducto', datos);
    mensaje('msg-agregar','✅ Solicitud enviada. Revisa la hoja en 1-2 minutos.',true);
    $('form-agregar').reset();
  }catch(err){
    mensaje('msg-agregar','❌ ' + err.message,false);
  }finally{
    btn.disabled = false;
  }
});

/* ---------- ELIMINAR ---------- */
async function eliminar(nombre){
  if(!confirm('¿Eliminar "' + nombre + '"?')) return;
  try{
    await enviarAccion('eliminarProducto', { nombre: nombre });
    mensaje('msg-eliminar','✅ Solicitud enviada. Verifica la hoja en 1-2 minutos.',true);
  }catch(err){
    mensaje('msg-eliminar','❌ ' + err.message,false);
  }
}

/* Cargar categorías al abrir */
cargarProductos();
</script>
</body>
</html>
