<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>JŌGAN - SUSHI EXPERIENCE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#A0855B">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Google Fonts: Cinzel (logo) + Cormorant Garamond (elegante) + Noto Serif JP (japonés) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍣</text></svg>">
  
  <meta property="og:title" content="JŌGAN | SUSHI EXPERIENCE">
  <meta property="og:description" content="Explora nuestro menú digital, arma tu pedido y envíalo directamente por WhatsApp.">
  <meta property="og:image" content="https://antonioitriago.github.io/JOGAN_Sushi-Experience/fondo.jpg">
  <meta property="og:url" content="https://antonioitriago.github.io/JOGAN_Sushi-Experience/">
  <meta property="og:type" content="website">
  
  <style>
    /* Paleta de colores basada en el logo */
    :root {
      --dorado-logo: #A0855B;        /* Color dorado/bronce del logo */
      --dorado-claro: #C9A961;       /* Dorado más claro para acentos */
      --dorado-oscuro: #7A6245;      /* Dorado oscuro para bordes */
      --texto-claro: #F5F0E8;        /* Color arroz para texto */
      --fondo-oscuro: rgba(0,0,0,0.85);
    }

    body {
      font-family: 'Cormorant Garamond', serif;
      color: var(--texto-claro);
      background: url('fondo.jpg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      padding-bottom: 80px;
    }

    /* Título principal - igual al logo */
    h1 {
      text-align: center;
      background: var(--fondo-oscuro);
      padding: 25px 20px;
      margin: 0;
      font-family: 'Cinzel', serif;
      font-size: 2.5em;
      font-weight: 600;
      letter-spacing: 8px;
      color: var(--dorado-logo);
      text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
    }

    .category {
      margin: 20px;
      background: rgba(0,0,0,0.8);
      border-radius: 12px;
      padding: 20px;
      border-left: 4px solid var(--dorado-logo);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    /* Categorías - misma fuente que el logo */
    .category h2 {
      margin-top: 0;
      border-bottom: 2px solid var(--dorado-logo);
      padding-bottom: 12px;
      font-family: 'Cinzel', serif;
      color: var(--dorado-logo);
      letter-spacing: 4px;
      font-size: 1.8em;
      font-weight: 600;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }

    .carousel {
      display: flex;
      overflow-x: auto;
      scroll-behavior: smooth;
    }
    .carousel::-webkit-scrollbar { display: none; }
    .carousel { -ms-overflow-style: none; scrollbar-width: none; }

    .item {
      flex: 0 0 auto;
      width: 260px;
      margin: 10px;
      background: rgba(20, 20, 20, 0.7);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      border: 1px solid rgba(160, 133, 91, 0.4);
      backdrop-filter: blur(5px);
    }

    /* Nombres de productos - misma fuente que el logo */
    .item h3 {
      margin: 0;
      font-family: 'Cinzel', serif;
      font-size: 1.25em;
      font-weight: 600;
      color: var(--dorado-logo);
      letter-spacing: 1.5px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    .item p { 
      font-size: 1em; 
      margin: 8px 0; 
      color: var(--texto-claro);
      font-family: 'Cormorant Garamond', serif;
    }

    .opciones { 
      font-size: 0.95em; 
      color: #E8DCC8; 
      font-style: italic; 
      min-height: 18px; 
    }

    .unidades { 
      font-size: 0.95em; 
      color: #D4C5A9; 
    }

    /* Precios en dorado */
    .precio {
      font-size: 1.3em;
      font-weight: 700;
      font-family: 'Cinzel', serif;
      color: var(--dorado-claro);
      margin-top: 12px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    .select-btn {
      margin-top: 12px;
      padding: 10px 20px;
      background: var(--dorado-logo);
      color: #1a1a1a;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 2px;
      transition: all 0.3s;
      font-family: 'Cinzel', serif;
      font-size: 0.9em;
    }

    .select-btn:hover {
      background: var(--dorado-claro);
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(160, 133, 91, 0.5);
    }

    .cantidad { 
      margin-top: 8px; 
      font-size: 0.95em; 
      color: var(--dorado-claro);
      font-family: 'Cormorant Garamond', serif;
    }

    #carrito-flotante {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--dorado-logo);
      color: #1a1a1a;
      border-radius: 50%;
      width: 65px;
      height: 65px;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(160, 133, 91, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      z-index: 1000;
      transition: transform 0.2s;
    }
    #carrito-flotante:active { transform: scale(0.9); }
    
    #contador-carrito {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #c0392b;
      color: white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 14px;
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-family: 'Cinzel', serif;
    }
    #pedido { display: none; }
  </style>
</head>
<body>
  <h1>JŌGAN 浄眼</h1>
  <div id="menu"></div>

  <a id="carrito-flotante" href="#" target="_blank">
    🛒
    <div id="contador-carrito">0</div>
  </a>

  <a id="pedido" href="#" target="_blank">📲 Pedir</a>

  <script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS4kg3_0KQlDJt72rSTB7nqi5G5XcvyV0_2zkAQkqfOkSxiNM8ggO_8E2XQ0qOwu1PVFR9iLyb00faG/pub?gid=0&single=true&output=tsv&v=" + new Date().getTime();
    const numeroWhatsApp = "584141889077";

    let seleccionados = {};

    async function loadMenu() {
      try {
        const res = await fetch(sheetUrl);
        const text = await res.text();
        
        const rows = text.trim().split("\n").map(r => r.split("\t"));
        const headers = rows[0].map(h => h.trim());
        const data = rows.slice(1);

        const categorias = {};

        data.forEach(row => {
          if (row.length < 2) return;
          
          const item = {};
          headers.forEach((h, i) => item[h] = (row[i] || "").trim());

          const disponible = item["Disponible"]?.toString().toUpperCase();
          const esDisponible = disponible === "TRUE" || disponible === "1" || disponible === "SI";
          
          if (esDisponible) {
            const categoria = item["Categoría"] || "Sin categoría";
            if (!categorias[categoria]) categorias[categoria] = [];
            categorias[categoria].push(item);
          }
        });

        const menuDiv = document.getElementById("menu");
        menuDiv.innerHTML = "";

        if (Object.keys(categorias).length === 0) {
          menuDiv.innerHTML = "<p style='text-align:center; padding:20px;'>No hay productos disponibles en este momento.</p>";
          return;
        }

        Object.keys(categorias).forEach(cat => {
          const catDiv = document.createElement("div");
          catDiv.className = "category";
          catDiv.innerHTML = `<h2>${cat}</h2><div class="carousel"></div>`;
          const carousel = catDiv.querySelector(".carousel");

          categorias[cat].forEach(item => {
            const nombre = item["Nombre del Producto"] || "";
            const opciones = item["Opciones / Proteína"] || "";
            const descripcion = item["Descripción / Ingredientes"] || "";
            const precio = item["Precio ($)"] || "0";
            const unidades = item["Unidades / Piezas"] || "";

            const div = document.createElement("div");
            div.className = "item";
            div.innerHTML = `
              <h3>${nombre}</h3>
              ${opciones ? `<p class="opciones"> ${opciones}</p>` : ""}
              ${descripcion ? `<p>${descripcion}</p>` : ""}
              ${unidades ? `<p class="unidades">📦 ${unidades}</p>` : ""}
              <p class="precio">${precio}</p>
              <button class="select-btn">AGREGAR</button>
              <div class="cantidad">Cantidad: 0</div>
            `;
            const btn = div.querySelector(".select-btn");
            const cantidadDiv = div.querySelector(".cantidad");

            btn.addEventListener("click", () => {
              if (!seleccionados[nombre]) seleccionados[nombre] = { item, cantidad: 0 };
              seleccionados[nombre].cantidad++;
              cantidadDiv.textContent = "Cantidad: " + seleccionados[nombre].cantidad;
              actualizarPedido();
            });

            carousel.appendChild(div);
          });

          menuDiv.appendChild(catDiv);
        });
      } catch (err) {
        document.getElementById("menu").innerHTML = "Error cargando menú 😢";
        console.error(err);
      }
    }

    function actualizarPedido() {
      const carritoBtn = document.getElementById("carrito-flotante");
      const contadorDiv = document.getElementById("contador-carrito");
      const items = Object.values(seleccionados);

      const totalProductos = items.reduce((a, b) => a + b.cantidad, 0);

      if (totalProductos === 0) {
        carritoBtn.href = "#";
        contadorDiv.style.display = "none";
        return;
      }

      contadorDiv.textContent = totalProductos;
      contadorDiv.style.display = "flex";

      let total = 0;
      let detalle = "";

      items.forEach(i => {
        const precioStr = String(i.item["Precio ($)"]).replace('$', '').replace(',', '.');
        const precioNum = parseFloat(precioStr) || 0;
        
        const subtotal = precioNum * i.cantidad;
        total += subtotal;
        detalle += `- ${i.item["Nombre del Producto"]} ×${i.cantidad} → $${subtotal.toFixed(2)}\n`;
      });

      const mensaje = `¡Hola! Quiero realizar un pedido en JŌGAN:\n\n${detalle}\n*TOTAL ESTIMADO:* $${total.toFixed(2)}\n\nPor favor, necesito confirmar el pedido, delivery y los detalles de pago. ¡Gracias!`;

      const url = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensaje)}`;
      carritoBtn.href = url;
    }

    loadMenu();
  </script>
  
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (window.location.href.includes('mesa')) {
        const style = document.createElement('style');
        style.textContent = `
          #carrito-flotante { display: none !important; }
          .select-btn { display: none !important; }
          .cantidad { display: none !important; }
          #contador-carrito { display: none !important; }
        `;
        document.head.appendChild(style);
        console.log('Modo mesa: elementos de pedido ocultos via CSS');
      }
    });
  </script>
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registrado:', reg.scope))
          .catch(err => console.log('SW error:', err));
      });
    }
  </script>
</body>
</html>
