<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>JGAN - SUSHI EXPERIENCE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Google Fonts: Noto Serif JP (estilo japonés) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍣</text></svg>">
  
  <meta property="og:title" content="JŌGAN | SUSHI EXPERIENCE">
  <meta property="og:description" content="Explora nuestro menú digital, arma tu pedido y envíalo directamente por WhatsApp.">
  <meta property="og:image" content="https://antonioitriago.github.io/JOGAN_Sushi-Experience/fondo.jpg">
  <meta property="og:url" content="https://antonioitriago.github.io/JOGAN_Sushi-Experience/">
  <meta property="og:type" content="website">
  
  <style>
    body {
      font-family: 'Noto Serif JP', serif;
      color: #F5F5DC;
      background: url('fondo.jpg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      padding-bottom: 80px;
    }
    h1 {
      text-align: center;
      background: rgba(0,0,0,0.85);
      padding: 20px;
      margin: 0;
      font-size: 2.2em;
      letter-spacing: 4px;
      color: #C5E17A;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    .category {
      margin: 20px;
      background: rgba(0,0,0,0.75);
      border-radius: 12px;
      padding: 18px;
      border-left: 4px solid #9ACD32;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .category h2 {
      margin-top: 0;
      border-bottom: 2px solid #9ACD32;
      padding-bottom: 10px;
      color: #C5E17A;
      letter-spacing: 3px;
      font-size: 1.6em;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }
    .carousel {
      display: flex;
      overflow-x: auto;
      scroll-behavior: smooth;
    }
    .carousel::-webkit-scrollbar { display: none; }
    .carousel { -ms-overflow-style: none; scrollbar-width: none; }
    .item {
      flex: 0 0 auto;
      width: 250px;
      margin: 10px;
      background: rgba(245, 245, 220, 0.1);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      border: 1px solid rgba(154, 205, 50, 0.4);
      backdrop-filter: blur(5px);
    }
    .item h3 {
      margin: 0;
      font-size: 1.2em;
      color: #C5E17A;
      letter-spacing: 1px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    .item p { font-size: 0.9em; margin: 6px 0; color: #F5F5DC; }
    .opciones { font-size: 0.85em; color: #FAF0E6; font-style: italic; min-height: 18px; }
    .unidades { font-size: 0.85em; color: #E8F5E9; }
    .precio {
      font-size: 1.2em;
      font-weight: bold;
      color: #C5E17A;
      margin-top: 12px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    .select-btn {
      margin-top: 10px;
      padding: 10px 16px;
      background: #9ACD32;
      color: #1a1a1a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
      transition: all 0.3s;
      font-family: 'Noto Serif JP', serif;
    }
    .select-btn:hover {
      background: #C5E17A;
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(154, 205, 50, 0.4);
    }
    .cantidad { margin-top: 6px; font-size: 0.9em; color: #C5E17A; }

    #carrito-flotante {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #9ACD32;
      color: #1a1a1a;
      border-radius: 50%;
      width: 65px;
      height: 65px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(154, 205, 50, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      z-index: 1000;
      transition: transform 0.2s;
    }
    #carrito-flotante:active { transform: scale(0.9); }
    #contador-carrito {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #ff4444;
      color: white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 14px;
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    #pedido { display: none; }
  </style>
</head>
<body>
  <h1>JŌGAN 浄眼</h1>
  <div id="menu"></div>

  <a id="carrito-flotante" href="#" target="_blank">
    🛒
    <div id="contador-carrito">0</div>
  </a>

  <a id="pedido" href="#" target="_blank">📲 Pedir</a>

  <script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS4kg3_0KQlDJt72rSTB7nqi5G5XcvyV0_2zkAQkqfOkSxiNM8ggO_8E2XQ0qOwu1PVFR9iLyb00faG/pub?gid=0&single=true&output=tsv&v=" + new Date().getTime();
    const numeroWhatsApp = "584148165364";

    let seleccionados = {};

    async function loadMenu() {
      try {
        const res = await fetch(sheetUrl);
        const text = await res.text();
        
        const rows = text.trim().split("\n").map(r => r.split("\t"));
        const headers = rows[0].map(h => h.trim());
        const data = rows.slice(1);

        const categorias = {};

        data.forEach(row => {
          if (row.length < 2) return;
          
          const item = {};
          headers.forEach((h, i) => item[h] = (row[i] || "").trim());

          const disponible = item["Disponible"]?.toString().toUpperCase();
          const esDisponible = disponible === "TRUE" || disponible === "1" || disponible === "SI";
          
          if (esDisponible) {
            const categoria = item["Categoría"] || "Sin categoría";
            if (!categorias[categoria]) categorias[categoria] = [];
            categorias[categoria].push(item);
          }
        });

        const menuDiv = document.getElementById("menu");
        menuDiv.innerHTML = "";

        if (Object.keys(categorias).length === 0) {
          menuDiv.innerHTML = "<p style='text-align:center; padding:20px;'>No hay productos disponibles en este momento.</p>";
          return;
        }

        Object.keys(categorias).forEach(cat => {
          const catDiv = document.createElement("div");
          catDiv.className = "category";
          catDiv.innerHTML = `<h2>${cat}</h2><div class="carousel"></div>`;
          const carousel = catDiv.querySelector(".carousel");

          categorias[cat].forEach(item => {
            const nombre = item["Nombre del Producto"] || "";
            const opciones = item["Opciones / Proteína"] || "";
            const descripcion = item["Descripción / Ingredientes"] || "";
            const precio = item["Precio ($)"] || "0";
            const unidades = item["Unidades / Piezas"] || "";

            const div = document.createElement("div");
            div.className = "item";
            div.innerHTML = `
              <h3>${nombre}</h3>
              ${opciones ? `<p class="opciones">🥩 ${opciones}</p>` : ""}
              ${descripcion ? `<p>${descripcion}</p>` : ""}
              ${unidades ? `<p class="unidades">📦 ${unidades}</p>` : ""}
              <p class="precio">${precio}</p>
              <button class="select-btn">Agregar</button>
              <div class="cantidad">Cantidad: 0</div>
            `;
            const btn = div.querySelector(".select-btn");
            const cantidadDiv = div.querySelector(".cantidad");

            btn.addEventListener("click", () => {
              if (!seleccionados[nombre]) seleccionados[nombre] = { item, cantidad: 0 };
              seleccionados[nombre].cantidad++;
              cantidadDiv.textContent = "Cantidad: " + seleccionados[nombre].cantidad;
              actualizarPedido();
            });

            carousel.appendChild(div);
          });

          menuDiv.appendChild(catDiv);
        });
      } catch (err) {
        document.getElementById("menu").innerHTML = "Error cargando menú 😢";
        console.error(err);
      }
    }

    function actualizarPedido() {
      const carritoBtn = document.getElementById("carrito-flotante");
      const contadorDiv = document.getElementById("contador-carrito");
      const items = Object.values(seleccionados);

      const totalProductos = items.reduce((a, b) => a + b.cantidad, 0);

      if (totalProductos === 0) {
        carritoBtn.href = "#";
        contadorDiv.style.display = "none";
        return;
      }

      contadorDiv.textContent = totalProductos;
      contadorDiv.style.display = "flex";

      let total = 0;
      let detalle = "";

      items.forEach(i => {
        const precioStr = String(i.item["Precio ($)"]).replace('$', '').replace(',', '.');
        const precioNum = parseFloat(precioStr) || 0;
        
        const subtotal = precioNum * i.cantidad;
        total += subtotal;
        detalle += `- ${i.item["Nombre del Producto"]} ×${i.cantidad} → $${subtotal.toFixed(2)}\n`;
      });

      const mensaje = `¡Hola! Quiero realizar un pedido en JŌGAN:\n\n${detalle}\n*TOTAL ESTIMADO:* $${total.toFixed(2)}\n\nPor favor, necesito confirmar el pedido, delivery y los detalles de pago. ¡Gracias!`;

      const url = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensaje)}`;
      carritoBtn.href = url;
    }

    loadMenu();
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (window.location.href.includes('mesa')) {
        const style = document.createElement('style');
        style.textContent = `
          #carrito-flotante { display: none !important; }
          .select-btn { display: none !important; }
          .cantidad { display: none !important; }
          #contador-carrito { display: none !important; }
        `;
        document.head.appendChild(style);
        console.log('Modo mesa: elementos de pedido ocultos via CSS');
      }
    });
  </script>
</body>
</html>
