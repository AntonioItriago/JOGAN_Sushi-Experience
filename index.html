<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>JŌGAN - SUSHI EXPERIENCE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Icono de la pestaña -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍣</text></svg>">
  
  <!-- Etiquetas para compartir en redes sociales -->
  <meta property="og:title" content="JŌGAN | SUSHI EXPERIENCE">
  <meta property="og:description" content="Explora nuestro menú digital, arma tu pedido y envíalo directamente por WhatsApp.">
  <meta property="og:image" content="https://antonioitriago.github.io/JOGAN_Sushi-Experience/fondo.jpg">
  <meta property="og:url" content="https://antonioitriago.github.io/JOGAN_Sushi-Experience/">
  <meta property="og:type" content="website">
  
  <style>
    body {
      font-family: 'Georgia', serif;
      color: #fff;
      background: url('fondo.jpg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      padding-bottom: 80px;
    }
    h1 {
      text-align: center;
      background: rgba(0,0,0,0.8);
      padding: 20px;
      margin: 0;
      font-size: 2em;
      letter-spacing: 3px;
    }
    .category {
      margin: 20px;
      background: rgba(0,0,0,0.7);
      border-radius: 10px;
      padding: 15px;
      border-left: 3px solid #c9a961;
    }
    .category h2 {
      margin-top: 0;
      border-bottom: 2px solid #c9a961;
      padding-bottom: 8px;
      color: #c9a961;
      letter-spacing: 2px;
    }
    .carousel {
      display: flex;
      overflow-x: auto;
      scroll-behavior: smooth;
    }
    .carousel::-webkit-scrollbar {
      display: none;
    }
    .carousel {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .item {
      flex: 0 0 auto;
      width: 240px;
      margin: 10px;
      background: rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      border: 1px solid rgba(201, 169, 97, 0.3);
    }
    .item h3 {
      margin: 0;
      font-size: 1.1em;
      color: #c9a961;
      letter-spacing: 1px;
    }
    .item p {
      font-size: 0.9em;
      margin: 5px 0;
      color: #e0e0e0;
    }
    .opciones {
      font-size: 0.8em;
      color: #d4af37;
      font-style: italic;
      min-height: 18px;
    }
    .unidades {
      font-size: 0.85em;
      color: #b8d4e3;
    }
    .precio {
      font-size: 1.1em;
      font-weight: bold;
      color: #fff;
      margin-top: 10px;
    }
    .select-btn {
      margin-top: 8px;
      padding: 8px 12px;
      background: #c9a961;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
      transition: all 0.3s;
    }
    .select-btn:hover {
      background: #d4af37;
      transform: scale(1.05);
    }
    .cantidad {
      margin-top: 5px;
      font-size: 0.9em;
      color: #c9a961;
    }

    #carrito-flotante {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #c9a961;
      color: #000;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      text-decoration: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      z-index: 1000;
      transition: transform 0.2s;
    }
    #carrito-flotante:active {
      transform: scale(0.9);
    }
    #contador-carrito {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #ff4444;
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 14px;
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    #pedido {
      display: none;
    }
  </style>
</head>
<body>
  <h1>JŌGAN 浄眼</h1>
  <div id="menu"></div>

  <a id="carrito-flotante" href="#" target="_blank">
    🛒
    <div id="contador-carrito">0</div>
  </a>

  <a id="pedido" href="#" target="_blank">📲 Pedir</a>

  <script>
    // ✅ TRUCO ANTI-CACHÉ: Añadimos la hora actual al final de la URL
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS4kg3_0KQlDJt72rSTB7nqi5G5XcvyV0_2zkAQkqfOkSxiNM8ggO_8E2XQ0qOwu1PVFR9iLyb00faG/pub?gid=0&single=true&output=tsv&v=" + new Date().getTime();
    const numeroWhatsApp = "584148165364";

    let seleccionados = {};

    async function loadMenu() {
      try {
        const res = await fetch(sheetUrl);
        const text = await res.text();
        
        // Dividimos por líneas y luego por tabulaciones
        const rows = text.trim().split("\n").map(r => r.split("\t"));
        
        // ✅ LIMPIEZA DE HEADERS: Eliminamos espacios invisibles
        const headers = rows[0].map(h => h.trim());
        const data = rows.slice(1);

        const categorias = {};

        data.forEach(row => {
          if (row.length < 2) return; // Ignorar filas vacías
          
          const item = {};
          // Asignamos valores limpios
          headers.forEach((h, i) => item[h] = (row[i] || "").trim());

          // ✅ VALIDACIÓN ROBUSTA DE DISPONIBILIDAD
          const disponible = item["Disponible"]?.toString().toUpperCase();
          const esDisponible = disponible === "TRUE" || disponible === "1" || disponible === "SI";
          
          if (esDisponible) {
            const categoria = item["Categoría"] || "Sin categoría";
            if (!categorias[categoria]) categorias[categoria] = [];
            categorias[categoria].push(item);
          }
        });

        const menuDiv = document.getElementById("menu");
        menuDiv.innerHTML = "";

        if (Object.keys(categorias).length === 0) {
          menuDiv.innerHTML = "<p style='text-align:center; padding:20px;'>No hay productos disponibles en este momento.</p>";
          return;
        }

        Object.keys(categorias).forEach(cat => {
          const catDiv = document.createElement("div");
          catDiv.className = "category";
          catDiv.innerHTML = `<h2>${cat}</h2><div class="carousel"></div>`;
          const carousel = catDiv.querySelector(".carousel");

          categorias[cat].forEach(item => {
            const nombre = item["Nombre del Producto"] || "";
            const opciones = item["Opciones / Proteína"] || "";
            const descripcion = item["Descripción / Ingredientes"] || "";
            const precio = item["Precio ($)"] || "0";
            const unidades = item["Unidades / Piezas"] || "";

            const div = document.createElement("div");
            div.className = "item";
            div.innerHTML = `
              <h3>${nombre}</h3>
              ${opciones ? `<p class="opciones">🥩 ${opciones}</p>` : ""}
              ${descripcion ? `<p>${descripcion}</p>` : ""}
              ${unidades ? `<p class="unidades"> ${unidades}</p>` : ""}
              <p class="precio">$${precio}</p>
              <button class="select-btn">Agregar</button>
              <div class="cantidad">Cantidad: 0</div>
            `;
            const btn = div.querySelector(".select-btn");
            const cantidadDiv = div.querySelector(".cantidad");

            btn.addEventListener("click", () => {
              if (!seleccionados[nombre]) seleccionados[nombre] = { item, cantidad: 0 };
              seleccionados[nombre].cantidad++;
              cantidadDiv.textContent = "Cantidad: " + seleccionados[nombre].cantidad;
              actualizarPedido();
            });

            carousel.appendChild(div);
          });

          menuDiv.appendChild(catDiv);
        });
      } catch (err) {
        document.getElementById("menu").innerHTML = "Error cargando menú 😢";
        console.error(err);
      }
    }

    function actualizarPedido() {
      const carritoBtn = document.getElementById("carrito-flotante");
      const contadorDiv = document.getElementById("contador-carrito");
      const items = Object.values(seleccionados);

      const totalProductos = items.reduce((a, b) => a + b.cantidad, 0);

      if (totalProductos === 0) {
        carritoBtn.href = "#";
        contadorDiv.style.display = "none";
        return;
      }

      contadorDiv.textContent = totalProductos;
      contadorDiv.style.display = "flex";

      let total = 0;
      let detalle = "";

      items.forEach(i => {
        // ✅ Corregido para manejar comas en decimales (ej: $6,00)
        const precioStr = String(i.item["Precio ($)"]).replace('$', '').replace(',', '.');
        const precioNum = parseFloat(precioStr) || 0;
        
        const subtotal = precioNum * i.cantidad;
        total += subtotal;
        detalle += `- ${i.item["Nombre del Producto"]} ×${i.cantidad} → $${subtotal.toFixed(2)}\n`;
      });

      const mensaje = `¡Hola! Quiero realizar un pedido en JŌGAN:\n\n${detalle}\n*TOTAL ESTIMADO:* $${total.toFixed(2)}\n\nPor favor, necesito confirmar el pedido, delivery y los detalles de pago. ¡Gracias!`;

      const url = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensaje)}`;
      carritoBtn.href = url;
    }

    loadMenu();
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (window.location.href.includes('mesa')) {
        const style = document.createElement('style');
        style.textContent = `
          #carrito-flotante { display: none !important; }
          .select-btn { display: none !important; }
          .cantidad { display: none !important; }
          #contador-carrito { display: none !important; }
        `;
        document.head.appendChild(style);
        console.log('Modo mesa: elementos de pedido ocultos via CSS');
      }
    });
  </script>
</body>
</html>
